<vbox onload="__addonInstance___Preferences.init()">
  <linkset>
    <html:link rel="localization" href="__addonRef__-preferences.ftl" />
  </linkset>
  <groupbox>
    <hbox align="center">
      <checkbox
        id="__addonRef___brightness-enabled"
        preference="__prefsPrefix__.brightness.enabled"
        data-l10n-id="brightness-filter"
      />
      <html:input
        type="number"
        min="50"
        max="150"
        step="5"
        preference="__prefsPrefix__.brightness.default"
        style="width: 5em; margin-inline-start: 8px"
      />
    </hbox>
    <hbox align="center">
      <checkbox
        id="__addonRef___contrast-enabled"
        preference="__prefsPrefix__.contrast.enabled"
        data-l10n-id="contrast-filter"
      />
      <html:input
        type="number"
        min="80"
        max="360"
        step="10"
        preference="__prefsPrefix__.contrast.default"
        style="width: 5em; margin-inline-start: 8px"
      />
    </hbox>
    <hbox align="center">
      <checkbox
        id="__addonRef___saturate-enabled"
        preference="__prefsPrefix__.saturate.enabled"
        data-l10n-id="saturate-filter"
      />
      <html:input
        type="number"
        min="0"
        max="200"
        step="10"
        preference="__prefsPrefix__.saturate.default"
        style="width: 5em; margin-inline-start: 8px"
      />
    </hbox>
    <hbox align="center">
      <checkbox
        id="__addonRef___grayscale-enabled"
        preference="__prefsPrefix__.grayscale.enabled"
        data-l10n-id="grayscale-filter"
      />
      <html:input
        type="number"
        min="0"
        max="100"
        step="5"
        preference="__prefsPrefix__.grayscale.default"
        style="width: 5em; margin-inline-start: 8px"
      />
    </hbox>
    <hbox align="center">
      <checkbox
        id="__addonRef___sepia-enabled"
        preference="__prefsPrefix__.sepia.enabled"
        data-l10n-id="sepia-filter"
      />
      <html:input
        type="number"
        min="0"
        max="100"
        step="5"
        preference="__prefsPrefix__.sepia.default"
        style="width: 5em; margin-inline-start: 8px"
      />
    </hbox>
    <hbox align="center">
      <checkbox
        id="__addonRef___hue-rotate-enabled"
        preference="__prefsPrefix__.hue-rotate.enabled"
        data-l10n-id="hue-rotate-filter"
      />
      <html:input
        type="number"
        min="0"
        max="360"
        step="15"
        preference="__prefsPrefix__.hue-rotate.default"
        style="width: 5em; margin-inline-start: 8px"
      />
    </hbox>
    <hbox align="center">
      <checkbox
        id="__addonRef___invert-enabled"
        preference="__prefsPrefix__.invert.enabled"
        data-l10n-id="invert-filter"
      />
      <html:input
        type="number"
        min="0"
        max="100"
        step="5"
        preference="__prefsPrefix__.invert.default"
        style="width: 5em; margin-inline-start: 8px"
      />
    </hbox>
  </groupbox>
</vbox>
